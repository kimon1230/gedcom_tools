name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Type check
        run: mypy src/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    env:
      # fast-langdetect reads this; default is /tmp, which is not cacheable.
      FTLANG_CACHE: ${{ github.workspace }}/.ftlang-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Ten tests build a real detector, which downloads a 126 MB fasttext
      # model from a third-party CDN. Without this a CDN outage is a red build
      # with no code change. Linux only - the Windows runners would need a
      # separate key and gain half as much.
      - name: Cache language model
        if: runner.os == 'Linux'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ github.workspace }}/.ftlang-cache
          key: ftlang-${{ runner.os }}-lid.176.bin

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest tests/ -q

  redirected-output:
    # Guards the UnicodeEncodeError that made the CLI unscriptable on Windows:
    # it worked interactively and died the moment stdout was captured.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e "."

      # The natural reproduction: on Windows a redirected stream defaults to the
      # ANSI codepage, which cannot encode Greek. The query is deliberately
      # ASCII so that argv encoding is not also in play.
      - name: Redirect to a file
        shell: bash
        run: |
          gedcom-tools --no-color search tests/fixtures/non_ascii_names.ged "born:1901" > out.txt
          gedcom-tools --format json search tests/fixtures/non_ascii_names.ged "born:1901" > out.json

      - name: Redirected output is UTF-8 and keeps the original names
        shell: python
        run: |
          import pathlib, sys

          expected = "Ανδρέου"  # Andreou in Greek
          for name in ("out.txt", "out.json"):
              text = pathlib.Path(name).read_text(encoding="utf-8")
              if expected not in text:
                  sys.exit(f"{name}: expected name missing from redirected output")

      # PYTHONIOENCODING is honoured rather than overridden, so here the tool
      # must escape rather than re-encode - and above all must not crash.
      - name: A forced legacy codepage degrades instead of crashing
        shell: bash
        env:
          PYTHONIOENCODING: cp1252
        run: |
          gedcom-tools --no-color search tests/fixtures/non_ascii_names.ged "born:1901" > legacy.txt
          gedcom-tools --no-color validate tests/fixtures/non_ascii_names.ged --full > legacy_validate.txt

      - name: Legacy-codepage output is pure ASCII
        shell: python
        run: |
          import pathlib, sys

          for name in ("legacy.txt", "legacy_validate.txt"):
              data = pathlib.Path(name).read_bytes()
              if not data:
                  sys.exit(f"{name}: no output produced")
              try:
                  data.decode("ascii")
              except UnicodeDecodeError as exc:
                  sys.exit(f"{name}: expected escaped ASCII, got {exc}")
