[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kimon-gedcom-tools"
version = "1.2.1"
description = "CLI utility for GEDCOM file validation, analysis, and search"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "ged4py>=0.5.2,<0.6",
    # Imported directly by commands/convert/transcoder.py. ged4py pulls it in
    # too, but relying on that transitive edge breaks `convert` at import time
    # the day ged4py drops it.
    "ansel>=1.0,<2",
    "fast-langdetect>=1.0.0,<2.0.0",
    "rapidfuzz>=3.0.0",
    # 1.1 has no wheels and its Cython source fails to build on 3.13.
    "DoubleMetaphone>=1.2",
]

[project.optional-dependencies]
dev = [
    # Floors track what CI and local development actually run. Deliberately
    # uncapped so linters pick up new releases; expect the occasional red build
    # from a tool update rather than from a code change.
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.16",
    "black>=26.5",
    "mypy>=2.3",
    "pip-audit>=2.10",
    "jsonschema>=4.26",
]
# Reserved, not yet consumed by any import. The REPL command's `graph` subcommand
# is what will use it; the extra ships ahead of that because README and the 1.1.1
# release notes already document `pip install kimon-gedcom-tools[graph]`.
graph = ["kimon-gedgraph>=1.0.0,<2.0.0"]

[project.scripts]
gedcom-tools = "gedcom_tools.cli:main"

[project.urls]
Homepage = "https://github.com/kimon1230/gedcom_tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S110", "BLE001"]

[tool.mypy]
python_version = "3.11"
strict = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=gedcom_tools --cov-report=term-missing --cov-fail-under=95"
markers = [
    "network: downloads the 126 MB language-detection model on a cold cache; deselect with -m 'not network'",
]

[tool.coverage.run]
source = ["src/gedcom_tools"]
