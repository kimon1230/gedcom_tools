[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kimon-gedcom-tools"
version = "1.1.1"
description = "CLI utility for GEDCOM file validation, analysis, and search"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "ged4py>=0.5.2,<0.6",
    "fast-langdetect>=1.0.0,<2.0.0",
    "rapidfuzz>=3.0.0",
    "DoubleMetaphone>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "mypy>=1.0",
    "pip-audit>=2.0",
    "jsonschema>=4.0",
]
graph = ["kimon-gedgraph>=1.0.0,<2.0.0"]

[project.scripts]
gedcom-tools = "gedcom_tools.cli:main"

[project.urls]
Homepage = "https://github.com/kimon1230/gedcom_tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=gedcom_tools --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["src/gedcom_tools"]
